<!doctype html>
<html lang="en" data-lg-theme="light" data-lg-mode="clear">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/glass.css"><link rel="stylesheet" href="/site.css"><script src="/site.js"></script>
<title>Dashboard | GlassPost</title>
</head>
<body class="antialiased">
<main id="main-content" class="gp-container gp-stage" style="padding-top:120px;padding-bottom:64px">
  <div id="account" class="lg-glass-surface lg-panel--card" data-lg-preset="standard" data-lg-refraction="none" style="padding:16px 20px;display:flex;align-items:center;gap:14px;margin-bottom:20px"></div>
  <div class="gp-grid gp-split">
    <section class="lg-glass-surface lg-panel--card" data-lg-preset="standard" data-lg-refraction="none" style="padding:24px">
      <form id="composer" style="display:grid;gap:16px">
        <h2 style="margin:0;font-size:22px;letter-spacing:-.02em">New post</h2>
        <div class="gp-seg lg-glass-surface lg-panel--pill" data-lg-preset="control" role="group" aria-label="Post type">
          <button type="button" data-type="IMAGE" aria-pressed="true">Photo</button>
          <button type="button" data-type="REELS" aria-pressed="false">Reel</button>
        </div>
        <div class="gp-field"><label for="file" id="file-label">Photo (JPEG, up to 8 MB)</label><input id="file" class="lg-input" data-lg-refraction="none" type="file" accept="image/jpeg" required></div>
        <div class="gp-field"><label for="caption">Caption</label><textarea id="caption" class="lg-input lg-textarea" data-lg-refraction="none" rows="5" maxlength="2200"></textarea><span id="count">0 / 2,200</span></div>
        <div class="gp-field"><label for="when">Publish at (your local time)</label><input id="when" class="lg-input" data-lg-refraction="none" type="datetime-local" required></div>
        <div id="message" class="gp-alert" role="status" hidden></div>
        <button id="submit" type="submit" class="lg-button lg-button--prominent lg-button--lg">
          <span class="lg-button__layers" aria-hidden="true"><span class="lg-button__light"></span><span class="lg-button__distortion"></span><span class="lg-button__tint"></span><span class="lg-button__shine"></span><span class="lg-button__bloom"></span><span class="lg-button__rim"></span></span>
          <span class="lg-button__label">Schedule post</span>
        </button>
      </form>
    </section>
    <section class="lg-glass-surface lg-panel--card" data-lg-preset="standard" data-lg-refraction="none" style="padding:24px">
      <h2 style="margin:0 0 16px;font-size:22px;letter-spacing:-.02em">Queue</h2>
      <ul id="queue" style="list-style:none;margin:0;padding:0;display:grid;gap:14px"></ul>
    </section>
  </div>
</main>
<script src="/app.js" defer></script>
</body>
</html>
